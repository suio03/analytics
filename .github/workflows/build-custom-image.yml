name: Build Custom Plausible CE Image

on:
  push:
    branches:
      - custom/v2.1.5
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GHCR_REPO: ghcr.io/${{ github.repository_owner }}/plausible-custom

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-22.04
          - platform: linux/arm64
            runner: ubuntu-22.04-arm

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Prepare platform name
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Check out source
        uses: actions/checkout@v4

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GHCR_REPO }}
          tags: |
            type=raw,value=v2.1.5-custom
            type=sha,prefix=v2.1.5-custom-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push platform image
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.GHCR_REPO }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}
          build-args: |
            MIX_ENV=ce
            BUILD_METADATA=${{ steps.meta.outputs.json }}
            ERL_FLAGS=+JMsingle true

      - name: Export image digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.docker_build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload image digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    runs-on: ubuntu-22.04
    needs: build

    steps:
      - name: Download image digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GHCR_REPO }}
          tags: |
            type=raw,value=v2.1.5-custom
            type=sha,prefix=v2.1.5-custom-

      - name: Publish multi-platform image
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.GHCR_REPO }}@sha256:%s ' *)

      - name: Inspect published image
        run: docker buildx imagetools inspect "${{ env.GHCR_REPO }}:v2.1.5-custom"

  deploy:
    name: Deploy verified image to Dokploy
    runs-on: ubuntu-22.04
    needs: publish
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      DOKPLOY_DEPLOY_WEBHOOK: ${{ secrets.DOKPLOY_DEPLOY_WEBHOOK }}
    steps:
      - name: Require deployment configuration
        run: test -n "$DOKPLOY_DEPLOY_WEBHOOK"

      - name: Wait for CI on this commit
        run: |
          for attempt in $(seq 1 80); do
            result=$(gh run list --repo "$GITHUB_REPOSITORY" \
              --workflow elixir.yml --commit "$GITHUB_SHA" --event push \
              --limit 1 --json status,conclusion)
            status=$(jq -r '.[0].status // "pending"' <<< "$result")
            if [ "$status" = "completed" ]; then
              test "$(jq -r '.[0].conclusion' <<< "$result")" = "success"
              exit $?
            fi
            sleep 15
          done
          echo "Timed out waiting for Elixir CI"
          exit 1

      - name: Check this is still the release branch head
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/custom/v2.1.5" --jq .object.sha)
          test "$current" = "$GITHUB_SHA"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Promote verified image
        run: |
          docker buildx imagetools create \
            --tag "$GHCR_REPO:v2.1.5-production" \
            "$GHCR_REPO:v2.1.5-custom-${GITHUB_SHA:0:7}"

      - name: Trigger Dokploy deployment
        run: |
          jq -n --arg sha "$GITHUB_SHA" \
            '{ref:"refs/heads/custom/v2.1.5",after:$sha,head_commit:{id:$sha,message:("Deploy verified image " + $sha)}}' \
            > "$RUNNER_TEMP/dokploy-payload.json"
          code=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --connect-timeout 10 --max-time 60 \
            --header 'Content-Type: application/json' \
            --header 'X-GitHub-Event: push' \
            --data-binary "@$RUNNER_TEMP/dokploy-payload.json" \
            "$DOKPLOY_DEPLOY_WEBHOOK")
          test "$code" = "200"
